name: Threads エンゲージメント（いいね・フォロー）

on:
  schedule:
    - cron: '0 2 * * *'   # JST 11:00 (UTC 2:00) 毎日
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行（実際にはいいね・フォローしない）'
        type: boolean
        default: true

jobs:
  engage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: エンゲージメント実行
        env:
          THREADS_COOKIES_JSON: ${{ secrets.THREADS_COOKIES_JSON }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            python _pipeline/scripts/threads_engagement.py --dry-run
          else
            python _pipeline/scripts/threads_engagement.py
          fi

      - name: 履歴をコミット
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pipeline/data/engagement_history.json
          git diff --cached --quiet || git commit -m "chore: update engagement history [skip ci]"
          git push
