name: Threads 週次レポート

on:
  # schedule:
  #   - cron: '0 1 * * 1'   # 毎週月曜 JST 10:00 (UTC 1:00)
  workflow_dispatch:       # 手動実行

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install requests

      - name: レポート生成
        env:
          THREADS_USER_ID:      ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python _pipeline/scripts/threads_weekly_report.py

      - name: レポートをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _pipeline/data/reports/
          git diff --cached --quiet || git commit -m "chore: add weekly threads report [skip ci]"
          git pull --rebase && git push
