name: 記事自動生成

on:
  schedule:
    - cron: '0 21 * * *'   # JST 毎朝6時 (UTC 21:00)
    - cron: '0 9 * * *'    # JST 毎夕6時 (UTC 9:00)
  workflow_dispatch:        # GitHubから手動実行も可能

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Python 3.11 セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '_pipeline/requirements.txt'

      - name: 依存パッケージをインストール
        run: pip install -r _pipeline/requirements.txt

      - name: 記事生成パイプラインを実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          POSTS_DIR: _posts
          SITE_DIR: .
        run: python _pipeline/scripts/run_pipeline.py --dry-run

      - name: 新規記事をコミット＆プッシュ
        run: |
          git config user.email "actions@github.com"
          git config user.name "GadgetPost Bot"
          git add _posts/ _pipeline/data/
          git diff --staged --quiet || (
            git commit -m "Auto: $(TZ='Asia/Tokyo' date +'%Y-%m-%d %H:%M JST') 記事追加" &&
            git pull --rebase &&
            git push
          )
