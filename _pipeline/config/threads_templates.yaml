# ===========================
# ポイント攻略・お得情報系
# ===========================
point_tips:
  - |
    Amazonセールで損してる人が多いこと

    ポイントアップキャンペーンにエントリーしてない
    セールページを開いてワンタップするだけで+2.5%還元

    3万円の買い物なら750円分のポイントが追加で乗ってくる
    これを知らないのは本当にもったいない

  - |
    ポイント最大化の正しい順序

    ① プライム会員確認（+2%）
    ② ポイントアップキャンペーンエントリー（+2.5%）
    ③ アプリで購入（+0.5%）
    ④ ギフトカードでチャージ（+0.5%）

    合計最大7.5%還元・5万円の買い物なら3,750円戻ってくる

  - |
    ポイント還元の落とし穴

    1注文1万円以上が適用条件になることが多い
    安い商品を単品で買っても対象外になる場合がある

    まとめ買いor高単価の商品で使うのが正解

  - |
    プライム30日無料体験の使い方

    セール前日に登録→セール期間フル活用→必要なければ解約
    送料無料＋ポイント還元＋Prime Videoが全部無料になる

    年間プランに移行するかは使いながら判断すれば十分

  - |
    ギフトカード事前チャージが地味に効く理由

    チャージ額の0.5%がポイントになる
    購入時のポイント還元と二重取りができる

    大きな買い物の前日にやっておくだけで数百円変わります

# ===========================
# 比較・どっちがいい系
# ===========================
comparison:
  - |
    ワイヤレスイヤホンの正解を1行で言う

    iPhone → AirPods Pro 3
    Android → Sony WF-1000XM6
    コスパ重視 → Soundcore Liberty 4 NC

    デバイスに合わせて選べば後悔しない

  - |
    Fire TV Stick 選び方の全部

    4Kテレビがない → 通常版（3,980円）で十分
    4Kテレビがある → 4K Max（7,980円）一択
    Wi-Fiが不安定 → 4K Maxはルーター機能もあって安定する

    迷ったら4K Maxを選んで後悔した人を見たことがない

  - |
    スマートホーム 予算別の始め方

    〜5,000円 → Echo Dot だけ（声でタイマー・音楽）
    〜15,000円 → Echo Dot ＋ SwitchBot Hub 2（家電を自動化）
    〜30,000円 → ＋スマート照明・スマートプラグも追加

    一気にやらず少しずつ広げるのが失敗しないコツ

  - |
    充電器で失敗しない選び方

    MacBook持ち → 67W以上のGaN一択（純正より小さくて同性能）
    iPhone＋iPad → 2ポート以上必須（1ポートは不便すぎる）
    旅行が多い → 折りたたみプラグ付きが正義

    GaN充電器に変えると純正に戻れなくなります

  - |
    Kindle vs スマホアプリ 本当の違い

    スマホはSNSが開けてしまう（集中できない）
    E-Inkは目が疲れない（2〜3時間余裕で読める）
    Kindleは充電が週1でいい（スマホは毎日必要）

    読書を習慣にしたい人は専用機を買う価値が確実にある

