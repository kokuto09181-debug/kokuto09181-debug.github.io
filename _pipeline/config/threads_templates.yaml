# ===========================
# ポイント攻略・お得情報系
# ===========================
point_tips:
  - |
    Amazonセールで損してる人が多いこと

    「ポイントアップキャンペーン」に
    エントリーしてない人がめちゃ多い

    やること: セールページ → エントリーボタンをタップ
    これだけで+2.5%還元される

    10万円の買い物なら2,500円分が変わる

  - |
    Amazon新生活セール ポイント最大化の方法

    ① プライム登録 + エントリー → +2.5%
    ② Amazon Mastercardゴールド → +3%
    ③ アプリから購入 → +0.5%
    ④ ギフトカード事前チャージ → +0.5%

    合計最大7.5%
    AirPods Pro 3（32,800円）なら 2,460円分戻る

  - |
    ポイント還元で気をつけること

    1回の注文が1万円以上じゃないと対象外

    Echo Dot（2,980円）を単品で買っても
    ポイントアップは適用されない

    他の商品と合わせて1万円超えるようにするか
    まとめ買いが正解

  - |
    Amazonプライムの30日無料体験を使い切る方法

    セール前日に登録 → セール期間中フル活用 → 解約

    これだけで送料無料 + ポイント還元 + Prime Video が無料

    解約は「アカウント → プライム → 会員資格を終了」から
    手続きは5分で完了

  - |
    ギフトカードのチャージが地味に効く

    Amazonギフトカード（自分用）を事前にチャージすると
    チャージ額の0.5%がポイントになる

    さらに購入時のポイント還元も上乗せ
    二重に得できる

    セール前にやっておくことリストに追加して

# ===========================
# 比較・どっちがいい系
# ===========================
comparison:
  - |
    イヤホン選びの正解

    iPhoneユーザー → AirPods Pro 3
    Androidユーザー → Sony WF-1000XM6
    コスパ重視 → Soundcore Liberty 4 NC

    この3択でほぼ全員カバーできる
    用途と予算で選ぶだけ

  - |
    Fire TV Stick の選び方

    4K対応テレビがない → 通常版でいい
    4Kテレビがある・Wi-Fi安定させたい → 4K Max一択

    Wi-Fi 6Eの差は混んでる環境ほど効く
    マンションなら4K Maxを選んで後悔しない

  - |
    スマートホームを始めるなら何から買うか

    予算5,000円 → Echo Dot だけで十分
    予算15,000円 → Echo Dot + SwitchBot Hub 2
    予算30,000円 → ↑ + SwitchBotデバイス複数

    Echo Dot を核にしてじわじわ広げるのが正解
    一気にやろうとすると挫折する

  - |
    充電器で失敗しない選び方

    MacBook Air持ち → 67W以上のGaN充電器
    iPhone+iPad持ち → 2ポート以上が必須
    旅行が多い → 折りたたみプラグが正義

    Ankerのは全部品質安定してるので
    ポート数と出力だけ見て選べば外れない

  - |
    Kindle を買うかどうか迷ってる人へ

    「Kindleアプリで読めばいい」という意見があるが

    長時間読むなら E-Ink の目の疲れなさが段違い
    スマホは結局SNSを開いてしまう

    本を読む習慣をつけたい人ほど
    専用デバイスを買う意味がある

