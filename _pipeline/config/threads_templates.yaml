# ===========================
# 通常時（ガジェット知識・雑談系）
# ===========================
general:
  - |
    ワイヤレスイヤホンの「コーデック」知ってますか

    SBC → 基本品質（全機種対応）
    AAC → iPhone向け（音質が上がる）
    LDAC → ハイレゾ（Androidで真価を発揮）

    Androidなら必ずLDAC対応かチェックして選んでください

  - |
    Amazonの「見せかけセール」を見抜く方法

    Keepa（無料Chrome拡張）を入れると価格グラフが見える
    セール直前に値上げしてたら本物のセールじゃない

    本当にお得かどうかは過去最安値と比べて判断するのが正解

  - |
    GaN充電器に変えて3ヶ月経った感想

    純正に戻る気が完全にゼロになった
    MacBook用・スマホ用・iPad用を1つにまとめられた
    カバンが物理的に軽くなった

    MacBookユーザーは純正を手放す価値があります

  - |
    メッシュWi-Fiを入れて変わったこと3つ

    ① 2階で動画が途切れなくなった
    ② スマートホームデバイスが安定した
    ③ Wi-Fi死角という概念がなくなった

    一軒家・広いマンションは単体ルーターより確実にメッシュWi-Fiです

  - |
    Kindleを使い始めて読書量が3倍になった理由

    「本を開くまでのハードルが低い」だけだった
    バッグから取り出す vs 棚から探すの差は思ったより大きい

    E-Inkで目が疲れないのと充電が週1でいいのも地味に効いてます

  - |
    帰宅前にエアコンを自動でつけられるようにした

    SwitchBot ＋ Alexa で「位置情報が自宅から2km以内」をトリガーに
    帰宅30分前に自動でエアコンがONになる設定にした

    夏の帰宅が快適になっただけじゃなく光熱費も少し下がった

  - |
    ノイキャン強度を体感で正直にランク付け

    S: WH-1000XM6（会議室の声が消える）
    A+: AirPods Pro 3（電車・カフェは完全に消える）
    A: WF-1000XM6（日常使いに十分すぎる）
    B: Liberty 4 NC（価格を考えると驚異的）

    日常使いならAクラスで集中できます

  - |
    Fire TV Stickを使い始めてからテレビのリモコンをほぼ使わなくなった

    「〇〇を再生して」だけで大抵なんでも動く
    TVer対応で民放の見逃し配信も無料で見られる

    テレビの使い方が変わる体験は1度してほしい

  - |
    Amazonのポイントを使い忘れてる人が多い

    期間限定ポイントは有効期限があって消えます
    「ポイントを先に使う」設定に変えておくのがおすすめ

    マイアカウント→ポイント設定から1分でできます

  - |
    新生活に本当に変化をもたらすガジェット5選

    1. ワイヤレスイヤホン（通勤・作業の質が変わる）
    2. スマートスピーカー（タイマー・音楽が声で操作できる）
    3. Fire TV Stick（テレビの使い方が変わる）
    4. GaN充電器（荷物が減る）
    5. メッシュWi-Fi（家中どこでも快適になる）

    全部セールで揃えるのが賢い選択です

