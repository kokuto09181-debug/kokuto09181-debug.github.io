# ===========================
# ポイント攻略・お得情報系
# ===========================
point_tips:
  - |
    Amazonセールで損してる人が多いこと
    ポイントアップキャンペーンにエントリーしてない
    セールページから1タップするだけで+2.5%還元

  - |
    ポイント最大化の組み合わせ
    プライム+エントリー → +2.5%
    アプリ購入+ギフトカード → +1%
    合計最大7.5%

  - |
    ポイント還元の落とし穴
    1注文1万円以上が適用条件
    安い商品を単品で買っても対象外になる

  - |
    プライム30日無料体験の使い方
    セール前日に登録 → フル活用 → 解約
    送料無料+ポイント還元+Prime Videoが無料

  - |
    ギフトカード事前チャージが地味に効く
    チャージ額の0.5%がポイントになる
    購入時の還元と二重取りできる

# ===========================
# 比較・どっちがいい系
# ===========================
comparison:
  - |
    イヤホン選びの正解
    iPhone → AirPods Pro 3
    Android → Sony WF-1000XM6
    コスパ重視 → Soundcore Liberty 4 NC

  - |
    Fire TV Stick の選び方
    4Kテレビがない → 通常版でいい
    4Kテレビがある → 4K Max一択
    マンションなら4K Maxで後悔しない

  - |
    スマートホーム予算別の始め方
    〜5,000円 → Echo Dot だけ
    〜15,000円 → Echo Dot + SwitchBot Hub 2
    一気にやらず少しずつ広げるのが正解

  - |
    充電器で失敗しない選び方
    MacBook持ち → 67W以上のGaN一択
    iPhone+iPad → 2ポート以上必須
    旅行が多い → 折りたたみプラグが正義

  - |
    Kindle vs スマホアプリで読む
    スマホはSNSを開いてしまう
    E-Inkは目が疲れない
    本の習慣をつけたいなら専用機を買う価値がある

# ===========================
# セール終了カウントダウン
# ===========================
sale_countdown:
  - |
    ⏰ Amazon新生活セール 残り{days_left}日
    Echo Dot {sale_price}は今だけ
    迷ってるなら今日が最後のチャンス

  - |
    セール終了まで残り{days_left}日
    価格が戻る前に確認してほしい
    プロフのリンクで実質価格まとめてます

  - |
    {sale_end} セール終了
    商品価格だけでなくポイント還元も7.5%→1%に下がる
    実質価格で考えると差は大きい

# ===========================
# 通常時（ガジェット知識・雑談系）
# ===========================
general:
  - |
    ワイヤレスイヤホンの「コーデック」見てますか
    SBC→基本 / AAC→iPhone向け / LDAC→ハイレゾ
    Androidなら必ずLDAC対応かチェックして

  - |
    Amazonの「見せかけセール」を見抜く方法
    Keepa（無料拡張）を入れて価格グラフを確認
    セール直前に値上げしてたら本物じゃない

  - |
    GaN充電器に変えたら純正に戻れなくなった
    小さいのに出力が上・複数ポートで同時充電
    MacBookユーザーは純正を捨てていい

  - |
    メッシュWi-Fiを入れて変わったこと3つ
    2階で動画が途切れなくなった
    スマートホームが安定した
    Wi-Fi死角がなくなった

  - |
    Kindleを使い始めて読書量が3倍になった理由
    「本を開くまでのハードルが低い」だけだった
    バッグから取り出す→棚から探すの差は大きい

  - |
    外出先からエアコンを操作できるようになった
    SwitchBot + Alexa で帰宅30分前にON
    夏の帰宅が快適になったのと光熱費も減った

  - |
    ノイキャン強度ランキング（体感）
    S: WH-1000XM6 / A+: AirPods Pro 3
    A: WF-1000XM6 / B: Liberty 4 NC
    日常使いならAクラスで十分

  - |
    Fire TV Stick を使い始めてからテレビのリモコンをほぼ使わなくなった
    「〇〇を再生して」で大抵なんでも動く
    TVer対応で民放の見逃し配信も無料

  - |
    Amazonのポイントを使い忘れてる人が多い
    期間限定ポイントは有効期限がある
    「ポイントを先に使う」設定にしておくのがおすすめ

  - |
    新生活に本当に必要なガジェット5選
    1. ワイヤレスイヤホン 2. スマートスピーカー
    3. Fire TV 4. GaN充電器 5. メッシュWi-Fi
    全部セールで揃えると体感が変わる

