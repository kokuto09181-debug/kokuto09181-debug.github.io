# ===========================
# 通常時（ガジェット知識・雑談系）
# ===========================
general:
  - |
    ワイヤレスイヤホンを選ぶときに
    意外と見落とされるスペック「コーデック」

    SBC: 基本品質
    AAC: iPhoneで使えるやつ
    LDAC: ハイレゾ音質（Android向け）

    Androidユーザーは LDAC 対応かどうかを
    必ず確認してから買って

  - |
    Amazonの「見せかけセール」を見抜く方法

    ① Keepa を入れる（無料のブラウザ拡張）
    ② 商品ページで価格グラフを確認
    ③ セール直前に値上げしてないか確認

    本当のセールは「過去最安」に近い価格になる
    グラフが右肩上がりになってたら怪しい

  - |
    GaN充電器に変えてよかったこと

    純正より小さいのに出力が上
    複数ポートで同時充電できる
    発熱が少ない

    変えない理由がない
    特にMacBookユーザーは純正充電器を捨てていい

  - |
    メッシュWi-Fiを導入して変わったこと

    2階で動画が途切れなくなった
    Wi-Fi死角がなくなった
    スマートホームデバイスが安定した

    一軒家や広めのマンションなら
    単体ルーターよりメッシュ一択

  - |
    Kindleを使い始めて読書量が3倍になった

    理由を分析したら
    「本を開くまでのハードルが低い」だけだった

    棚から本を取り出す → バッグから取り出す
    この差だけでこんなに変わるとは思わなかった

  - |
    スマートホームを導入してから
    帰宅前に「エアコンつけておく」が当たり前になった

    外出先から操作できるスイッチボット
    30〜40分前にONしておくだけで

    夏の帰宅が全然違う
    光熱費も「必要な時だけ」で節約できた

  - |
    イヤホンのノイキャン強度ランキング（体感）

    S: Sony WH-1000XM6（ヘッドホン）
    A+: AirPods Pro 3
    A: Sony WF-1000XM6
    B: Soundcore Liberty 4 NC

    用途に合わせて選んで
    日常使いならAクラスで十分

  - |
    Fire TV Stick、使ったことない人に伝えたいこと

    テレビのリモコンをほぼ使わなくなる
    「〇〇を再生して」で大抵何でもできる

    TVer対応で民放の見逃し配信も無料
    これだけでもう元が取れてる

  - |
    Amazonのポイントを効率よく使う方法

    期間限定ポイントは有効期限に注意
    使い忘れが一番もったいない

    「ポイントを先に使う」設定にしておくと
    自動で消費されるのでおすすめ

  - |
    新生活に本当に必要なガジェット5選

    1. ワイヤレスイヤホン（通勤・集中用）
    2. スマートスピーカー（音声操作）
    3. 4K Fire TV（エンタメ）
    4. GaN充電器（デスク・旅行）
    5. メッシュWi-Fi（自宅環境整備）

    全部セールで買うと10万円以上節約できる

