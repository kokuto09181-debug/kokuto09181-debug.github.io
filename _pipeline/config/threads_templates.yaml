# Threads投稿テンプレート集
# LLM不使用 - プレースホルダーをPythonで埋める
# {name} 商品名 / {price} 現在価格 / {sale_price} セール予想価格
# {off} 割引率 / {effective} 実質価格 / {url} 商品URL
# {sale_end} セール終了日 / {days_left} 残り日数
# ※URLは本文では機能しないためプロフリンク誘導に統一

