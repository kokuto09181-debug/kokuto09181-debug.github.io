<header class="site-header">
  <div class="container">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="header-right">
      <nav class="site-nav">
        {% for item in site.data.navigation %}
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
            {{ item.title }}
          </a>
        {% endfor %}
      </nav>
      <div class="site-search">
        <form action="https://www.google.com/search" method="get" target="_blank">
          <input type="hidden" name="q" value="site:gadgetpost.uk">
          <input type="search" name="q" placeholder="記事を検索..." class="search-input" aria-label="サイト内検索">
          <button type="submit" class="search-btn" aria-label="検索">🔍</button>
        </form>
      </div>
    </div>
  </div>
</header>
